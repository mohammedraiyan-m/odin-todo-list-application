<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Todo App</title>
<script defer src="main.js"></script></head>
<body>
<h1>Todo List App</h1>

<div id="project-section">
  <h2>Projects</h2>
  <button id="create-project-btn">Create New Project</button>
  <ul id="project-list"></ul>
</div>

<div id="todo-section">
  <h2>Todos in <span id="current-project-name"></span></h2>
  <button id="add-todo-btn">Add Todo</button>
  <div id="todo-list"></div>
</div>

 
<div id="todo-modal" class="modal hidden">
  <div class="modal-content">
    <h3 id="modal-title">Add Todo</h3>
    <form id="todo-form" method="dialog">
      <input type="hidden" id="todo-id" />
      <label>Title: <input type="text" id="todo-title" required></label><br>
      <label>Description: <textarea id="todo-description"></textarea></label><br>
      <label>Due Date: <input type="date" id="todo-dueDate"></label><br>
      <label>Priority:
        <select id="todo-priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label><br>
      <label>Notes: <textarea id="todo-notes"></textarea></label><br>
      <button type="submit">Save</button>
      <button type="button" id="cancel-btn">Cancel</button>
    </form>
  </div>
</div>

<!-- <script src="app.js"></script> -->
</body>
</html>
